steps:
  # 1. Construir la imagen de Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '.'

  # 2. Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

  # 3. Desplegar en Cloud Run CON los secretos
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # --- ¡AQUÍ ESTÁ LA MAGIA! ---
      # Inyecta los secretos como variables de entorno
      - '--set-env-vars=AIRTABLE_API_KEY=$$AIRTABLE_API_KEY,AIRTABLE_BASE_ID=$$AIRTABLE_BASE_ID,AIRTABLE_TABLE_ID=$$AIRTABLE_TABLE_ID'
    
    # Le dice a Cloud Build que los valores $$ de arriba vienen de Secret Manager
    secretEnv: ['AIRTABLE_API_KEY', 'AIRTABLE_BASE_ID', 'AIRTABLE_TABLE_ID']

# Dónde se guardará la imagen
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

# Variables de sustitución
substitutions:
  _SERVICE_NAME: 'sumadots-backend'
  _REGION: 'europe-west1'
  _REPO_NAME: 'sumadots-backend' # (Puedes usar el mismo repo de Artifacts)

# --- ¡ESTA SECCIÓN ES NUEVA! ---
# Define de dónde sacar los secretos
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/AIRTABLE_API_KEY/versions/latest
      env: 'AIRTABLE_API_KEY' # El nombre que usamos en 'secretEnv'
    - versionName: projects/$PROJECT_ID/secrets/AIRTABLE_BASE_ID/versions/latest
      env: 'AIRTABLE_BASE_ID'
    - versionName: projects/$PROJECT_ID/secrets/AIRTABLE_TABLE_ID/versions/latest
      env: 'AIRTABLE_TABLE_ID'